<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistika — Car Price AI</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<nav>
  <span class="logo"> Car Price AI</span>
  <a href="index.html">Bosh sahifa</a>
  <a href="predict.html">Bashorat</a>
  <a href="stats.html" class="active">Statistika</a>
</nav>
<main>
  <h1>Model statistikasi</h1>
  <p class="subtitle">Uchta model taqqoslanadi va eng muhim xususiyatlar ko'rsatiladi.</p>

  <div class="card">
    <h3>Model natijalari</h3>
    <table id="comparison-table"></table>
  </div>

  <div class="card">
    <h3>RMSE solishtiruvi</h3>
    <canvas id="rmseChart" height="100"></canvas>
  </div>

  <div class="card">
    <h3>Eng muhim xususiyatlar (CatBoost)</h3>
    <canvas id="importanceChart" height="120"></canvas>
  </div>
</main>
<script>
const API_URL = "https://car-price-backend-f4jp.onrender.com/";

async function loadStats() {
  const res = await fetch(`${API_URL}/stats`);
  const stats = await res.json();

  // Jadval
  const table = document.getElementById("comparison-table");
  table.innerHTML = `
    <tr><th>Model</th><th>RMSE</th><th>R²</th><th>Vaqt (s)</th></tr>
    ${stats.model_comparison.map(m => `
      <tr><td>${m.model}</td><td>${m.rmse}</td><td>${m.r2}</td><td>${m.time}</td></tr>
    `).join("")}
  `;

  // RMSE grafik
  new Chart(document.getElementById("rmseChart"), {
    type: "bar",
    data: {
      labels: stats.model_comparison.map(m => m.model),
      datasets: [{ label: "RMSE", data: stats.model_comparison.map(m => m.rmse), backgroundColor: "#38bdf8" }],
    },
    options: { plugins: { legend: { display: false } } },
  });

  // Feature importance grafik
  new Chart(document.getElementById("importanceChart"), {
    type: "bar",
    data: {
      labels: stats.feature_importance.map(f => f.feature),
      datasets: [{ label: "Importance", data: stats.feature_importance.map(f => f.importance), backgroundColor: "#22c55e" }],
    },
    options: { indexAxis: "y", plugins: { legend: { display: false } } },
  });
}

loadStats();
</script>
</body>
</html>
